# SahlPay.ma - plateforme Big Data (Kafka KRaft + Spark standalone + MinIO + Jupyter)
#   docker compose build
#   docker compose up -d
# Interfaces : Spark Master http://localhost:8080 | Workers :8081 / :8082 | Spark UI (driver) :4040
#              MinIO console http://localhost:9001 | Jupyter http://localhost:8888
name: sahlpay

x-spark-common: &spark-common
  image: sahlpay/spark:3.5.3
  pull_policy: never          # image locale, construite une seule fois par le service spark-master
  networks: [sahlpay]
  restart: unless-stopped

services:
  # ------------------------------------------------------------------ Kafka (mode KRaft, sans ZooKeeper)
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    container_name: kafka
    hostname: kafka
    networks: [sahlpay]
    ports:
      - "9094:9094"            # acces depuis la machine hote (localhost:9094)
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # UUID base64 (22 caracteres)
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # Creation du topic "transactions" (3 partitions) puis arret du conteneur
  kafka-init:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    container_name: kafka-init
    networks: [sahlpay]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic transactions --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic transactions
    restart: "no"

  # ------------------------------------------------------------------ MinIO (couches Bronze / Silver / Gold)
  # Les images minio/minio et minio/mc ont ete supprimees de Docker Hub et quay.io (sept. 2026).
  # On utilise pgsty/silo : build communautaire du meme serveur MinIO (API S3 + console web,
  # memes variables MINIO_ROOT_USER / MINIO_ROOT_PASSWORD, client "mcli" = mc).
  minio:
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-09-16T00-00-00Z}
    container_name: minio
    hostname: minio
    networks: [sahlpay]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"            # API S3
      - "9001:9001"            # console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data
      - ./data:/import:ro      # pour copier les fichiers locaux dans le lac (mcli cp /import/...)
    restart: unless-stopped

  # Creation du bucket "lake" (client S3 officiel AWS CLI) puis arret du conteneur
  minio-init:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:latest}
    container_name: minio-init
    networks: [sahlpay]
    depends_on: [minio]
    environment: &aws-env
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://minio:9000 s3 ls > /dev/null 2>&1; do echo "attente de MinIO..."; sleep 2; done
        aws --endpoint-url http://minio:9000 s3 mb s3://lake 2>/dev/null || echo "bucket lake deja present"
        aws --endpoint-url http://minio:9000 s3 ls
    restart: "no"

  # Client S3 a la demande, ex. :  docker compose run --rm aws s3 ls --recursive s3://lake/
  aws:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:latest}
    profiles: ["tools"]
    networks: [sahlpay]
    environment: *aws-env
    volumes:
      - ./data:/data
    entrypoint: ["aws", "--endpoint-url", "http://minio:9000"]

  # ------------------------------------------------------------------ Spark standalone : 1 Master + 2 Workers
  spark-master:
    <<: *spark-common
    build:
      context: ./docker/spark
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      SPARK_LOCAL_HOSTNAME: spark-master
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8090:8080"
      - "7077:7077"

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "${SPARK_WORKER_CORES:-2}",
              "--memory", "${SPARK_WORKER_MEMORY:-2g}", "--webui-port", "8081"]
    environment:
      SPARK_LOCAL_HOSTNAME: spark-worker-1
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "${SPARK_WORKER_CORES:-2}",
              "--memory", "${SPARK_WORKER_MEMORY:-2g}", "--webui-port", "8081"]
    environment:
      SPARK_LOCAL_HOSTNAME: spark-worker-2
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8082:8081"

  # ------------------------------------------------------------------ Jupyter (driver PySpark, mode client)
  jupyter:
    <<: *spark-common
    container_name: jupyter
    hostname: jupyter
    depends_on: [spark-master, kafka, minio]
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root",
              "--ServerApp.token=", "--ServerApp.password=", "--ServerApp.root_dir=/home/sahlpay"]
    environment:
      SPARK_LOCAL_HOSTNAME: jupyter       # adresse annoncee par le driver aux executors
      SPARK_MASTER: spark://spark-master:7077
      KAFKA_BOOTSTRAP: kafka:9092
      LAKE: s3a://lake
      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip:/home/sahlpay/jobs
    ports:
      - "8888:8888"
      - "4040-4045:4040-4045"   # Spark UI des applications lancees depuis ce conteneur
    volumes:
      - ./notebooks:/home/sahlpay/notebooks
      - ./jobs:/home/sahlpay/jobs
      - ./producer:/home/sahlpay/producer
      - ./data:/home/sahlpay/data
      - ./graphx:/home/sahlpay/graphx
      - ./logs:/home/sahlpay/logs
      - ./rapport:/home/sahlpay/rapport

networks:
  sahlpay:
    name: sahlpay

volumes:
  minio-data:
